name: CI
on:
  pull_request:
  push:
    branches: [main, "kaptenjon-*"]
permissions:
  contents: read
env:
  TILE_URL: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore
      - name: Test solution with isolated PostgreSQL/PostGIS
        run: bash tests/report-workflow-db.test.sh
      - name: Upload regenerated Pi migration script on mismatch
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pi-workflow-migrations
          path: /tmp/pi-workflow-migrations.generated.sql
          if-no-files-found: ignore
          retention-days: 3
      - run: dotnet format --verify-no-changes --no-restore
      - name: JavaScript syntax
        run: |
          node --check src/VarPlats.Web/wwwroot/map.js
          node --check src/VarPlats.Web/wwwroot/passkeys.js
          node --check src/VarPlats.Web/wwwroot/service-worker.js
      - name: Deployment script checks
        run: |
          bash -n deploy/deploy-release.sh
          bash -n deploy/publish-release.sh
          bash -n deploy/release-image.sh
          bash -n deploy/verify-release-image.sh
          bash -n tests/report-workflow-db.test.sh
          bash tests/deploy-release.test.sh
      - name: Validate Compose without real secrets
        env:
          DATABASE_CONNECTION: Host=db;Database=varplats;Username=varplats;Password=ci-placeholder-only
        run: |
          docker compose -f deploy/compose.yml config --quiet
          docker compose -f deploy/compose.yml --profile photos config --quiet
          test "$(docker compose -f deploy/compose.yml config --services | sort | tr '\n' ' ')" = "db web "
          test "$(docker compose -f deploy/compose.yml --profile photos config --services | sort | tr '\n' ' ')" = "clamav db web "
          plain=$(docker compose -f deploy/compose.yml config --format json)
          for key in Reporting__PublicWrites Reporting__WorkflowEnabled Reporting__FlagsEnabled \
              Reporting__ArchiveEnabled Reporting__ConfirmationWithdrawalEnabled Reporting__PointsEnabled \
              Reporting__RateLimits__Enabled Photos__Enabled; do
            test "$(jq -r ".services.web.environment.$key" <<< "$plain")" = "false"
          done
          released=$(REPORTING_PUBLIC_WRITES=true PHOTOS_ENABLED=true \
            docker compose -f deploy/compose.yml --profile photos config --format json)
          test "$(jq -r '.services.web.environment.Reporting__PublicWrites' <<< "$released")" = "true"
          test "$(jq -r '.services.web.environment.Photos__Enabled' <<< "$released")" = "true"
          jq -e '.services.clamav.image | test("@sha256:[a-f0-9]{64}$")' <<< "$released"
          rendered_url=$(docker compose -f deploy/compose.yml config --format json | jq -r '.services.web.environment.Map__TileUrl')
          test "$rendered_url" = "$TILE_URL"
  arm64-smoke:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore
      - name: Test ARM64 with isolated PostgreSQL/PostGIS
        run: bash tests/report-workflow-db.test.sh
      - name: Build ARM64 images and exercise PostGIS
        shell: bash
        env:
          DATABASE_CONNECTION: Host=db;Database=varplats;Username=varplats;Password=ci-placeholder-only
        run: |
          set -euo pipefail
          mkdir -p deploy/secrets
          printf '%s' 'ci-placeholder-only' > deploy/secrets/db_password
          trap 'docker compose -f deploy/compose.yml down -v' EXIT
          docker compose -f deploy/compose.yml up -d --build
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/health/ready; then break; fi
            sleep 3
          done
          curl --fail http://localhost:8080/health/ready
          curl --fail http://localhost:8080/api/reports
          docker compose -f deploy/compose.yml exec -T web sh -c '
            set -e
            test -f /app/runtimes/linux-arm64/native/libSkiaSharp.so
            test -f /app/runtimes/linux-arm64/native/Magick.Native-Q8-arm64.dll.so
            test ! -d /app/runtimes/win-x64
            test -s /app/LICENSE
            test -s /app/THIRD-PARTY-NOTICES.md
            find /app/third-party-notices/nuget -type f -path "*Magick.NET-Q8-AnyCPU*" -iname Notice.txt -print -quit | grep -q .
            find /app/third-party-notices/nuget -type f -path "*SkiaSharp/*" -iname LICENSE.txt -print -quit | grep -q .
            find /app/third-party-notices/nuget -type f -path "*SkiaSharp.NativeAssets.Linux.NoDependencies*" -iname THIRD-PARTY-NOTICES.txt -print -quit | grep -q .
            test -s /app/third-party-notices/nuget-packages.json
            grep -q "NetTopologySuite.IO.PostGis" /app/third-party-notices/nuget-packages.json
            grep -q "80d8318173db37bd2ee9f3b53c4c736a1267e689" /app/third-party-notices/nuget-packages.json
          '
          docker compose -f deploy/compose.yml exec -T db psql -U varplats -d varplats -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE varplats_reader NOLOGIN;"
          docker compose -f deploy/compose.yml exec -T db psql -U varplats -d varplats -v ON_ERROR_STOP=1 \
            < deploy/identity-schema.sql
          docker compose -f deploy/compose.yml exec -T db psql -U varplats -d varplats -v ON_ERROR_STOP=1 \
            < deploy/pi-identity-role.sql
          docker compose -f deploy/compose.yml exec -T db psql -U varplats -d varplats -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE varplats_reader;
          INSERT INTO "AspNetUsers" ("Id", "EmailConfirmed", "PhoneNumberConfirmed",
              "TwoFactorEnabled", "LockoutEnabled", "AccessFailedCount")
          VALUES ('00000000-0000-0000-0000-000000000004', false, false, false, false, 0);
          DO $test$
          BEGIN
              IF NOT EXISTS (SELECT 1 FROM "IdentityAccountActivity"
                  WHERE "UserId" = '00000000-0000-0000-0000-000000000004'
                    AND "LastSignInAtUtc" IS NULL) THEN
                  RAISE EXCEPTION 'Identity account creation activity was not recorded';
              END IF;
          END
          $test$;
          DELETE FROM "AspNetUsers" WHERE "Id" = '00000000-0000-0000-0000-000000000004';
          DO $test$
          BEGIN
              IF EXISTS (SELECT 1 FROM "IdentityAccountActivity"
                  WHERE "UserId" = '00000000-0000-0000-0000-000000000004') THEN
                  RAISE EXCEPTION 'Identity account activity did not cascade on deletion';
              END IF;
              IF has_table_privilege('varplats_reader', 'reports', 'INSERT') THEN
                  RAISE EXCEPTION 'Identity grant unexpectedly allows report writes';
              END IF;
          END
          $test$;
          RESET ROLE;
          SQL
          # Pi-ordningen: migreringar (två gånger, idempotent), skrivgrant, arbetsflödesgrants.
          for script in pi-workflow-migrations.sql pi-workflow-migrations.sql \
              pi-public-write-role.sql pi-workflow-grants.sql; do
            docker compose -f deploy/compose.yml exec -T db psql -U varplats -d varplats -q -v ON_ERROR_STOP=1 \
              < "deploy/$script"
          done
          docker compose -f deploy/compose.yml exec -T db psql -U varplats -d varplats -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE
              item record;
          BEGIN
              IF (SELECT count(*) FROM "__EFMigrationsHistory") <> 10 THEN
                  RAISE EXCEPTION 'Expected all ten EF migrations to be recorded';
              END IF;
              FOR item IN SELECT * FROM (VALUES
                  ('report_submissions', 'SELECT', true), ('report_submissions', 'INSERT', true),
                  ('report_submissions', 'UPDATE', true), ('report_submissions', 'DELETE', false),
                  ('report_actions', 'INSERT', true), ('report_actions', 'DELETE', true),
                  ('report_actions', 'UPDATE', false),
                  ('report_action_confirmations', 'INSERT', true), ('report_action_confirmations', 'DELETE', true),
                  ('report_action_confirmations', 'UPDATE', false),
                  ('report_action_confirmation_withdrawals', 'INSERT', true),
                  ('report_action_confirmation_withdrawals', 'UPDATE', false),
                  ('report_action_confirmation_withdrawals', 'DELETE', false),
                  ('points_events', 'SELECT', true), ('points_events', 'INSERT', true),
                  ('points_events', 'UPDATE', false), ('points_events', 'DELETE', false),
                  ('points_events', 'TRUNCATE', false),
                  ('action_hearts', 'INSERT', true), ('action_hearts', 'DELETE', true),
                  ('action_hearts', 'UPDATE', false),
                  ('report_photos', 'INSERT', true), ('report_photos', 'UPDATE', false),
                  ('report_photos', 'DELETE', false),
                  ('content_flags', 'INSERT', true), ('content_flags', 'UPDATE', true),
                  ('content_flags', 'DELETE', false),
                  ('report_archives', 'INSERT', true), ('report_archives', 'DELETE', true),
                  ('report_archives', 'UPDATE', false),
                  ('report_archive_events', 'INSERT', true), ('report_archive_events', 'DELETE', false),
                  ('reports', 'INSERT', true), ('reports', 'DELETE', true), ('reports', 'UPDATE', false),
                  ('report_photos', 'TRUNCATE', false), ('content_flags', 'TRUNCATE', false)
              ) AS expected(tbl, privilege, allowed) LOOP
                  IF has_table_privilege('varplats_reader', item.tbl, item.privilege) <> item.allowed THEN
                      RAISE EXCEPTION 'Unexpected % privilege on % for varplats_reader', item.privilege, item.tbl;
                  END IF;
              END LOOP;
          END
          $test$;
          SQL
          docker compose -f deploy/compose.yml exec -T db psql -U varplats -d varplats -v ON_ERROR_STOP=1 \
            -c "SELECT PostGIS_Version();" \
            -c "INSERT INTO reports VALUES ('00000000-0000-0000-0000-000000000003','Test på ARM64','Syntetisk CI-rapport utan personuppgifter',0,ST_SetSRID(ST_Point(18.06,59.32),4326)::geography,now(),0);"
          curl --fail --silent http://localhost:8080/api/reports | grep 'Test på ARM64'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/reports)" = "405"
