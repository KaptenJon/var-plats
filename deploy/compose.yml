name: varplats
services:
  db:
    image: ${DB_IMAGE:-varplats-postgis:local}
    build:
      context: ./postgis
    platform: linux/arm64
    environment:
      POSTGRES_DB: varplats
      POSTGRES_USER: varplats
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varplats -d varplats"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  web:
    image: ${WEB_IMAGE:-varplats-web:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    platform: linux/arm64
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: ${PUBLIC_HOST:-localhost}
      ConnectionStrings__varplats: ${DATABASE_CONNECTION:?Set DATABASE_CONNECTION in the untracked .env file}
      Map__TileUrl: ${TILE_URL:?Set TILE_URL in the untracked .env file}
      Authentication__Enabled: ${AUTHENTICATION_ENABLED:-false}
      Reporting__PublicWrites: ${REPORTING_PUBLIC_WRITES:-false}
      Reporting__WorkflowEnabled: ${REPORTING_WORKFLOW_ENABLED:-false}
      Reporting__FlagsEnabled: ${REPORTING_FLAGS_ENABLED:-false}
      Reporting__ArchiveEnabled: ${REPORTING_ARCHIVE_ENABLED:-false}
      Reporting__RateLimits__Enabled: ${RATE_LIMITS_ENABLED:-false}
      Photos__Enabled: ${PHOTOS_ENABLED:-false}
      Photos__StoragePath: /var/lib/varplats/photos
      Photos__ScannerSocketPath: /run/varplats/scanner/clamd.sock
      Authentication__PublicBaseUrl: ${PUBLIC_BASE_URL:-}
      Authentication__Passkeys__ServerDomain: ${PASSKEY_SERVER_DOMAIN:-}
      Authentication__Passkeys__Origins__0: ${PASSKEY_ORIGIN:-}
      Authentication__Mailjet__ApiKey: ${MAILJET_API_KEY:-}
      Authentication__Mailjet__ApiSecret: ${MAILJET_API_SECRET:-}
      Authentication__Mailjet__SenderEmail: ${MAILJET_SENDER_EMAIL:-}
      Authentication__Mailjet__SenderName: ${MAILJET_SENDER_NAME:-Vår plats}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      Authentication__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      Authentication__AdminGitHubId: ${ADMIN_GITHUB_ID:-}
      Authentication__TrustedProxyIp: ${AUTHENTICATION_TRUSTED_PROXY_IP:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - dataprotection:/home/app/.aspnet/DataProtection-Keys
      - photos:/var/lib/varplats/photos
      - scanner-socket:/run/varplats/scanner
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  clamav:
    # Endast med profilen "photos". clamav/clamav saknar ARM64; clamav-debian 1.5 är
    # pinnad till sin linux/arm64-manifestdigest (verifierad mot registret 2026-11-20).
    image: ${CLAMAV_IMAGE:-clamav/clamav-debian:1.5@sha256:0470bfdde27380e21e196dd631a66a893729744843c077a460f80510de8bedbd}
    profiles: [photos]
    platform: linux/arm64
    # Samma UID som webben, så att socketen kan vara privat (0600) för båda.
    user: "1654:1654"
    init: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ ! -f /var/lib/clamav/main.cvd ] && [ ! -f /var/lib/clamav/main.cld ]; then
            freshclam --foreground --stdout --config-file=/etc/clamav/freshclam.conf
        fi
        freshclam --daemon --foreground --stdout --checks=2 --config-file=/etc/clamav/freshclam.conf &
        exec clamd --foreground --config-file=/etc/clamav/clamd.conf
    volumes:
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
      - ./freshclam.conf:/etc/clamav/freshclam.conf:ro
      - clamav-signatures:/var/lib/clamav
      - scanner-socket:/run/varplats/scanner
    healthcheck:
      test: ["CMD", "clamdscan", "--config-file=/etc/clamav/clamd.conf", "--ping=1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
secrets:
  db_password:
    file: ./secrets/db_password
volumes:
  postgres-data:
  dataprotection:
  photos:
  scanner-socket:
  clamav-signatures:
