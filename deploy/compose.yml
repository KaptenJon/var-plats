name: varplats
services:
  db:
    image: ${DB_IMAGE:-varplats-postgis:local}
    build:
      context: ./postgis
    platform: linux/arm64
    environment:
      POSTGRES_DB: varplats
      POSTGRES_USER: varplats
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varplats -d varplats"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  web:
    image: ${WEB_IMAGE:-varplats-web:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    platform: linux/arm64
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: ${PUBLIC_HOST:-localhost}
      ConnectionStrings__varplats: ${DATABASE_CONNECTION:?Set DATABASE_CONNECTION in the untracked .env file}
      Map__TileUrl: ${TILE_URL:?Set TILE_URL in the untracked .env file}
      Authentication__Enabled: ${AUTHENTICATION_ENABLED:-false}
      Reporting__PublicWrites: ${REPORTING_PUBLIC_WRITES:-false}
      Reporting__WorkflowEnabled: ${REPORTING_WORKFLOW_ENABLED:-false}
      Photos__Enabled: ${PHOTOS_ENABLED:-false}
      Photos__StoragePath: /var/lib/varplats/photos
      Photos__ScannerSocketPath: /run/varplats/scanner/clamd.sock
      Authentication__PublicBaseUrl: ${PUBLIC_BASE_URL:-}
      Authentication__Passkeys__ServerDomain: ${PASSKEY_SERVER_DOMAIN:-}
      Authentication__Passkeys__Origins__0: ${PASSKEY_ORIGIN:-}
      Authentication__Mailjet__ApiKey: ${MAILJET_API_KEY:-}
      Authentication__Mailjet__ApiSecret: ${MAILJET_API_SECRET:-}
      Authentication__Mailjet__SenderEmail: ${MAILJET_SENDER_EMAIL:-}
      Authentication__Mailjet__SenderName: ${MAILJET_SENDER_NAME:-Vår plats}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      Authentication__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      Authentication__AdminGitHubId: ${ADMIN_GITHUB_ID:-}
      Authentication__TrustedProxyIp: ${AUTHENTICATION_TRUSTED_PROXY_IP:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - dataprotection:/home/app/.aspnet/DataProtection-Keys
      - photos:/var/lib/varplats/photos
      - scanner-socket:/run/varplats/scanner
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.4}
    profiles: [photos]
    user: "1654:1654"
    volumes:
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
      - clamav-signatures:/var/lib/clamav
      - scanner-socket:/run/varplats/scanner
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    read_only: true
    tmpfs:
      - /tmp
      - /run/clamav
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
secrets:
  db_password:
    file: ./secrets/db_password
volumes:
  postgres-data:
  dataprotection:
  photos:
  scanner-socket:
  clamav-signatures:
