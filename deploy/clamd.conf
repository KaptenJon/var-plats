# Lokal clamd för Vår plats: endast Unix-socket, ingen TCP-lyssnare.
# Körs som UID 1654 (compose "user"), därför ingen User-rad.
LocalSocket /run/varplats/scanner/clamd.sock
LocalSocketMode 600
FixStaleSocket yes
Foreground yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogTime yes
# Minskar toppminnet på Pi vid signaturuppdatering (laddar om i stället för parallellt).
ConcurrentDatabaseReload no
StreamMaxLength 6M
MaxFileSize 6M
MaxScanSize 12M
MaxThreads 2
